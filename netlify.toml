# ==========================================
# Netlify Configuration - Tu Sitio Web 3.0
# ==========================================

[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/capture-lead"
  to = "/.netlify/functions/capture-lead"
  status = 200

[[redirects]]
  from = "/api/audit-site"
  to = "/.netlify/functions/audit-site"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
